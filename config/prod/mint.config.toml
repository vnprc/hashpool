[info]
listen_host = "127.0.0.1"
listen_port = 3338
url = "https://mint.hashpool.dev"
mnemonic = "abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon about"

[info.http_cache]
backend = "memory"
ttl = 60
tti = 60

[mint_info]
name = "Hashpool Mint"
description = "cashu mint to expose ehash and ecash operations to end user wallets"

[database]
engine = "sqlite"

[ln]
ln_backend = "fakewallet"
min_mint = 1
max_mint = 500000
min_melt = 1
max_melt = 500000

[fake_wallet]
supported_units = ["sat", "hash"]
fee_percent = 0.02
reserve_fee_min = 2
# These two have defaults, but we'll include them explicitly for clarity
# min_delay_time = 1
# max_delay_time = 3

[hashpool_mint]
db_path = "/var/lib/hashpool/mint/mint.sqlite"
# TODO(operator): set the pool's real identity key before deploying — this
# placeholder (the secp256k1 generator point) namespaces epoch units.
pool_pubkey = "0279be667ef9dcbbac55a06295ce870b07029bfcdb2dce28d959f2815b16f81798"
admin_listen = "127.0.0.1:3339"

[hashpool_mint.bitcoin_rpc]
# TODO(operator): point at the deployment's bitcoind RPC.
url = "http://127.0.0.1:48332"
user = "username"
pass = "password"
