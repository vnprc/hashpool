[info]
listen_host = "127.0.0.1"
listen_port = 3338
url = "https://mint.hashpool.dev"
mnemonic = "abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon about"

[info.http_cache]
backend = "memory"
ttl = 60
tti = 60

[mint_info]
name = "Hashpool Mint"
description = "cashu mint to expose ehash and ecash operations to end user wallets"

[database]
engine = "sqlite"

[ln]
ln_backend = "fakewallet"
min_mint = 1
max_mint = 500000
min_melt = 1
max_melt = 500000

[fake_wallet]
supported_units = ["sat", "hash"]
fee_percent = 0.02
reserve_fee_min = 2
# These two have defaults, but we'll include them explicitly for clarity
# min_delay_time = 1
# max_delay_time = 3

[hashpool_mint]
db_path = "/var/lib/hashpool/mint/mint.sqlite"
# TODO(operator): set the pool's real identity key before deploying — it
# namespaces epoch units. Left unset on purpose: an unedited config fails on
# the missing key rather than silently naming epochs after a copied value.
# pool_pubkey = "02..."
admin_listen = "127.0.0.1:3339"
# TODO(operator): set the mint's real receive address before deploying.
# Left unset on purpose: an unedited config fails at startup rather than
# silently naming epochs after a sentinel.
# receive_address = "bc1q..."
confirmation_depth = 6
poll_interval_secs = 10

[hashpool_mint.bitcoin_rpc]
# TODO(operator): point at the deployment's bitcoind RPC.
url = "http://127.0.0.1:48332"
user = "username"
pass = "password"
