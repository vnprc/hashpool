[info]
listen_host = "localhost"
listen_port = 3338
url = "http://localhost:3338"
# url = "https://mint.hashpool.dev"
mnemonic = "abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon about"

[info.http_cache]
backend = "memory"
ttl = 60
tti = 60

[mint_info]
name = "Hashpool Mint"
description = "cashu mint to expose ehash and ecash operations to end user wallets"

[database]
engine = "sqlite"

[ln]
ln_backend = "fakewallet"
min_mint = 1
max_mint = 500000
min_melt = 1
max_melt = 500000

[fake_wallet]
supported_units = ["sat", "hash"]
fee_percent = 0.02
reserve_fee_min = 2
# These two have defaults, but we'll include them explicitly for clarity
# min_delay_time = 1
# max_delay_time = 3

[hashpool_mint]
db_path = ".devenv/state/mint/mint.sqlite"
# Pool identity key namespacing epoch units (hash_<pool>_<height>).
# Dev placeholder: pubkey of sha256("hashpool dev pool identity") — not the
# miner locking key, and deliberately not the secp256k1 generator point
# either, since that well-known value is refused at startup; replace per
# deployment.
pool_pubkey = "034dcb73610a1af09a68b17e69d4e2ac8e1a05536264c2a805f027839ffd7de66a"
# Manual epoch-rotation lever (`just rotate-epoch`); loopback only.
admin_listen = "127.0.0.1:3339"
# Dev placeholder: the P2WPKH regtest address of the secp256k1 generator
# point above. No wallet controls it.
# Regtest scenarios mine rewards to it with `just generate-to`.
receive_address = "bcrt1qw508d6qejxtdg4y5r3zarvary0c5xw7kygt080"
confirmation_depth = 3
poll_interval_secs = 1

[hashpool_mint.bitcoin_rpc]
url = "http://127.0.0.1:18443"
user = "username"
pass = "password"

