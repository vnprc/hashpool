[info]
listen_host = "localhost"
listen_port = 3338
url = "http://localhost:3338"
# url = "https://mint.hashpool.dev"
mnemonic = "abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon about"

[info.http_cache]
backend = "memory"
ttl = 60
tti = 60

[mint_info]
name = "Hashpool Mint"
description = "cashu mint to expose ehash and ecash operations to end user wallets"

[database]
engine = "sqlite"

[ln]
ln_backend = "fakewallet"
min_mint = 1
max_mint = 500000
min_melt = 1
max_melt = 500000

[fake_wallet]
supported_units = ["sat", "hash"]
fee_percent = 0.02
reserve_fee_min = 2
# These two have defaults, but we'll include them explicitly for clarity
# min_delay_time = 1
# max_delay_time = 3

[hashpool_mint]
db_path = ".devenv/state/mint/mint.sqlite"
# Pool identity key namespacing epoch units (hash_<pool>_<height>).
# Dev placeholder: the secp256k1 generator point — deliberately NOT the miner
# locking key; replace per deployment.
pool_pubkey = "0279be667ef9dcbbac55a06295ce870b07029bfcdb2dce28d959f2815b16f81798"
# Manual epoch-rotation lever (`just rotate-epoch`); loopback only.
admin_listen = "127.0.0.1:3339"

[hashpool_mint.bitcoin_rpc]
url = "http://127.0.0.1:18443"
user = "username"
pass = "password"

